# =============================================================================
# Error Messages Configuration (English)
# =============================================================================
# Format:
#   error_key:
#     code: "ERR.<MODULE><NUMBER>"
#     message: "Human readable message"
#
# Module Codes:
#   SYS - System/Server errors
#   AUTH - Authentication/Authorization errors
#   USR - User module errors
#   ZON - Zone module errors
#   TBL - Table module errors
#   ORD - Order module errors
#   VAL - Validation errors
#   REQ - Request errors
#   RES - Resource errors
# =============================================================================


# =============================================================================
# SYSTEM / COMMON ERRORS
# =============================================================================

internal_server_error:
  code: "ERR.SYS0101"
  message: "Internal server error"

bad_request:
  code: "ERR.SYS0102"
  message: "Bad request"

not_found:
  code: "ERR.SYS0103"
  message: "Resource not found"


